[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fulfill-model"
version = "0.1.0.dev0"
description = "Composable sufficiency scenarios for the FULFILL hybrid input-output model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["numpy==2.1.1", "pandas==2.2.3", "openpyxl==3.1.0", "requests>=2.31,<3"]

[project.optional-dependencies]
model = ["mariopy==0.3.5"]
notebook = ["ipykernel>=6", "nbclient>=0.10", "matplotlib>=3.9"]
test = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
fulfill = "fulfill_model.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fulfill_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"Shocks/filled_files/BAU_0_2011.xlsx" = "fulfill_model/resources/paper-backgrounds/BAU_0_2011.xlsx"
"Shocks/filled_files/BAU_0_2020.xlsx" = "fulfill_model/resources/paper-backgrounds/BAU_0_2020.xlsx"
"Shocks/filled_files/BAU_0_2025.xlsx" = "fulfill_model/resources/paper-backgrounds/BAU_0_2025.xlsx"
"Shocks/filled_files/BAU_0_2030.xlsx" = "fulfill_model/resources/paper-backgrounds/BAU_0_2030.xlsx"
"Shocks/filled_files/BAU_0_2035.xlsx" = "fulfill_model/resources/paper-backgrounds/BAU_0_2035.xlsx"
"Shocks/filled_files/BAU_0_2040.xlsx" = "fulfill_model/resources/paper-backgrounds/BAU_0_2040.xlsx"
"Shocks/filled_files/BAU_0_2045.xlsx" = "fulfill_model/resources/paper-backgrounds/BAU_0_2045.xlsx"
"Shocks/filled_files/BAU_0_2050.xlsx" = "fulfill_model/resources/paper-backgrounds/BAU_0_2050.xlsx"
