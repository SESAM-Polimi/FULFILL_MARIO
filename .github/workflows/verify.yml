name: Verify sufficiency model
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[model,notebook,test]'
      - run: fulfill download --only shocks
      - run: python -m pytest -q
      - run: python tools/verify_paper_shocks.py --report /tmp/shock-audit.json
      - run: python -m ipykernel install --user --name fulfill-validation
      - run: python tools/execute_notebook.py notebooks/Explore_sufficiency.ipynb --kernel fulfill-validation --output /tmp/exploration.ipynb
